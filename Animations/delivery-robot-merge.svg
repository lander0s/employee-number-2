<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 300 240" width="300" height="240"
     role="img" aria-label="Cartoon delivery robot, three-quarter top-down, animated idle to holding">

  <!-- ============================================================
       CARTOON DELIVERY ROBOT / STATE: MERGE  -  3/4 top-down view
       ONE-SHOT, 2.2s. Starts AND ends on exactly the HOLDING pose.

         hold -> reach -> grab -> lift -> twoup -> wind -> SMASH
              -> settle -> hold

       The left hand dives to FRONT-CENTRE (the cell below the robot)
       for a second object while the right keeps hold of the first;
       both come up, the arms wind apart, then slam together and the
       robot is left holding a single object.

       Statically (no SMIL) it renders the HOLDING pose.
       Camera sits above and in front, ~55deg. You see the cargo lid
       (foreshortened) and the front face. Symmetric, so it mirrors
       cleanly for left/right facing sprites.
       Origin: casters plant on y=195, sprite centred on x=120.
       viewBox is widened to -30..270 (still centred on 120) purely to give
       the arms room; the robot's own coordinates never moved.
       ============================================================ -->

  <defs>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".45"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".82"  stop-color="#8FA3BA" stop-opacity="0"/>
      <stop offset="1"    stop-color="#8FA3BA" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="visorGlass" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#33475C"/>
      <stop offset="1" stop-color="#1B2838"/>
    </linearGradient>
  </defs>

  <g stroke="#1B2838" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ground shadow: static, the robot never leaves the ground -->
    <ellipse id="shadow" cx="120" cy="200" rx="62" ry="12" fill="#1B2838" opacity=".20" stroke="none">
      <animate attributeName="rx" values="62;60;62" dur="2.6s" repeatCount="indefinite"
               calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="opacity" values=".20;.18;.20" dur="2.6s" repeatCount="indefinite"
               calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </ellipse>

    <!-- Casters. NEVER transformed: they are the contact patch. Bottom edge
         sits on y=195, same as the shadow's centre line. Drawn before the
         chassis so the body hides their top half. -->
    <g id="wheels" fill="#2C3B4B">
      <rect x="74"  y="170" width="25" height="25" rx="12.5"/>
      <rect x="141" y="170" width="25" height="25" rx="12.5"/>
    </g>

    <!-- Body only. Rock / bob THIS group; pivot 120 194. The wheels stay
         planted underneath, so a tilt reads as suspension travel.
         The held object must move WITH the hands. Put it in #payload
         below and it inherits every transform on this group for free. -->
    <g id="chassis">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -2.5; 0 0" dur="2.6s" repeatCount="indefinite"
                        calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <!-- cargo lid (top face, foreshortened) -->
      <path fill="#EEF3F9" d="M92 86 L148 86 Q158 86 162.8 94.8 L178.2 123.2
                              Q183 132 173 132 L67 132 Q57 132 61.8 123.2
                              L77.2 94.8 Q82 86 92 86 Z"/>
      <path fill="#DCE5EF" stroke-width="4"
            d="M99 95 L141 95 Q149 95 152.6 101.6 L165 121
               Q169 126 161 126 L79 126 Q71 126 75 121 L87.4 101.6 Q91 95 99 95 Z"/>

      <!-- parcel emblem on the lid -->
      <g stroke-width="3.5">
        <path fill="#F2A65A" d="M106 103 L134 103 L137 119 L103 119 Z"/>
        <path fill="#C9762F" stroke="none" d="M116.6 103 L123.4 103 L124.6 119 L115.4 119 Z"/>
      </g>

      <!-- front face -->
      <path fill="#EEF3F9"
            d="M57 132 L183 132 L176.5 171 Q174 186 159 186
               L81 186 Q66 186 63.5 171 Z"/>
      <path fill="url(#bodyShade)" stroke="none"
            d="M57 132 L183 132 L176.5 171 Q174 186 159 186
               L81 186 Q66 186 63.5 171 Z"/>

      <!-- headlight strips -->
      <g fill="#FFD166" stroke-width="3.5">
        <rect x="71" y="174" width="17" height="8" rx="4"/>
        <rect x="152" y="174" width="17" height="8" rx="4"/>
      </g>

      <!-- visor + face -->
      <rect x="74" y="139" width="92" height="35" rx="15" fill="url(#visorGlass)"/>

      <g fill="#5CF2DF" stroke="none">
        <!-- left eye -->
        <ellipse cx="101" cy="154" rx="9.5" ry="11">
          <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;.90;.935;.97;1"
                   dur="4.6s" repeatCount="indefinite"/>
        </ellipse>
        <!-- right eye -->
        <ellipse cx="139" cy="154" rx="9.5" ry="11">
          <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;.90;.935;.97;1"
                   dur="4.6s" repeatCount="indefinite"/>
        </ellipse>
        <!-- catchlights -->
        <g fill="#FFFFFF" opacity=".9">
          <circle cx="97.5" cy="150" r="2.6">
            <animate attributeName="opacity" values=".9;.9;0;.9;.9" keyTimes="0;.90;.935;.97;1"
                     dur="4.6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="135.5" cy="150" r="2.6">
            <animate attributeName="opacity" values=".9;.9;0;.9;.9" keyTimes="0;.90;.935;.97;1"
                     dur="4.6s" repeatCount="indefinite"/>
          </circle>
        </g>
        <!-- smile -->
        <path fill="none" stroke="#5CF2DF" stroke-width="3.5" d="M110 167 Q120 172.5 130 167"/>
      </g>
      <!-- glass gleam -->
      <path fill="#FFFFFF" opacity=".15" stroke="none" d="M88 141 L99 141 L84 172 L77 168 Z"/>


      <!-- lidar puck -->
      <path fill="#3E5468" d="M106 84 L106 88 A14 6.5 0 0 0 134 88 L134 84 Z"/>
      <ellipse cx="120" cy="84" rx="14" ry="6.5" fill="#5A7288"/>
      <ellipse cx="120" cy="84" rx="5" ry="2.4" fill="#5CF2DF" stroke="none" opacity=".9"/>
      <!-- antenna + delivery pennant -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-2 152 90; 2.5 152 90; -2 152 90" dur="3.1s"
                          repeatCount="indefinite" calcMode="spline"
                          keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <path fill="none" stroke-width="4.5" d="M152 92 Q160 66 168 44"/>
        <path fill="#FF8A3D" stroke-width="4"
              d="M168 44 L194 51 L167 60 Z"/>
        <circle cx="168" cy="42" r="4.5" fill="#FFD166" stroke-width="4"/>
      </g>

      <!-- PAYLOAD SLOT. Empty by design - drop the held object in here and
           it is already centred, already gripped, and already inherits the
           chassis bob/rock. Drawn before the arms on purpose: the claws
           close over the front of it. Local origin 0,0 = the grip centre,
           so a crate is just <rect x="-27" y="-27" width="54" height="54"/>. -->
      <g id="payload-a" transform="translate(120.0,96.0)" opacity="1">
        <!-- object A: starts in the two-handed grip, slides into the right claw as the left hand leaves, ends at the collision -->
        <animateTransform attributeName="transform" type="translate"
           values="120.0 96.0;120.0 96.0;131.0 100.5;131.0 100.5;160.1 90.0;172.7 81.5;131.0 99.3;152.0 94.3;148.7 97.5"
           keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1" begin="merge.begin" dur="2.2s"
           fill="freeze" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
        <animate attributeName="opacity" values="1;1;1;1;1;1;1;0;0"
           keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1" begin="merge.begin" dur="2.2s" fill="freeze"/>
      </g>

      <g id="payload-b" transform="translate(115.0,188.6)" opacity="1">
        <!-- object B: waits in the cell in front, then rides the left claw up -->
        <animateTransform attributeName="transform" type="translate"
           values="115.0 188.6;115.0 188.6;115.0 188.6;115.0 188.6;79.9 90.0;67.3 81.5;109.0 99.3;88.0 94.3;91.3 97.5"
           keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1" begin="merge.begin" dur="2.2s"
           fill="freeze" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
        <animate attributeName="opacity" values="1;1;1;1;1;1;1;0;0"
           keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1" begin="merge.begin" dur="2.2s" fill="freeze"/>
      </g>

      <g id="payload" transform="translate(120.0,96.0)" opacity="0">
        <!-- the merged result, in the same slot the HOLDING sprite uses -->
        <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;1"
           keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1" begin="merge.begin" dur="2.2s" fill="freeze"/>
      </g>

      <!-- ================== ARM RIG ==================
           Nested joints, so a pose is 3 angles per arm and the segment
           lengths can never drift. Interpolating hand POSITIONS instead
           would collapse the arm to ~70% length at the midpoint.

             lengths   upper 32.5   forearm 29   finger 13 at +/-33deg
             pose      shoulder   elbow   wrist
             idle       169.4     -34.4   -45
             hold       261.1      66.3    37.5

           The right arm is the SAME rig under scale(-1,1), so both arms
           take identical angle numbers - never flip signs.

           PLAYBACK. One animation per joint, 9 keyframes each. The
           first carries id="merge"; the other five and all three
           payload slots are slaved to begin="merge.begin":

               svg.getElementById('merge').beginElement();

           GRAB POINT: 115.0, 188.6  - the left claw alone, angled inboard
           so the grip lands near the centre line (x=120).

           PAYLOAD SLOTS:
             #payload-a  object A, already held. Slides into the right
                         claw as the left hand leaves.
             #payload-b  object B, waiting in the cell in front.
             #payload    the merged result at 120,96.

           POSE TABLE (left arm; right arm mirrored, same numbers):
             pose     shoulder    elbow    wrist
             hold        -98.9     66.4     37.5
             hold        -98.9     66.4     37.5
             reach        55.2    -36.5     19.3
             grab         55.2    -36.5     19.3
             twoup      -110.5     62.5     40.0
             wind       -111.9     38.1     55.0
             smash       -69.5     41.7     25.0
             settle     -101.7     62.9     40.0
             hold        -98.9     66.4     37.5
           The elbow may cross 0 (arm straightens) but never +/-180,
           which would fold it flat back through its own shoulder.
           -->
      <g stroke-linecap="round" stroke-linejoin="round">

        <g id="arm-l" transform="translate(58,144)">
          <g class="j-sh" transform="rotate(-98.9)">
            <animateTransform id="merge" attributeName="transform" type="rotate"
               values="-98.9;-98.9;55.2;55.2;-110.5;-111.9;-69.5;-101.7;-98.9"
               keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1"
               begin="0s" dur="2.2s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
            <path d="M0 0 L32.5 0" stroke="#1B2838" stroke-width="16"/>
            <path d="M0 0 L32.5 0" stroke="#EEF3F9" stroke-width="9.5"/>
            <g transform="translate(32.5,0)">
              <g class="j-el" transform="rotate(66.4)">
                <animateTransform attributeName="transform" type="rotate"
                   values="66.4;66.4;-36.5;-36.5;62.5;38.1;41.7;62.9;66.4"
                   keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1"
                   begin="merge.begin" dur="2.2s" fill="freeze"
                   calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
                <path d="M0 0 L29 0" stroke="#1B2838" stroke-width="15"/>
                <path d="M0 0 L29 0" stroke="#EEF3F9" stroke-width="9"/>
                <g transform="translate(29,0)">
                  <g class="j-wr" transform="rotate(37.5)">
                    <animateTransform attributeName="transform" type="rotate"
                       values="37.5;37.5;19.3;19.3;40.0;55.0;25.0;40.0;37.5"
                       keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1"
                       begin="merge.begin" dur="2.2s" fill="freeze"
                       calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
                    <path d="M0 0 L10.9 7.08"  stroke="#1B2838" stroke-width="12"/>
                    <path d="M0 0 L10.9 -7.08" stroke="#1B2838" stroke-width="12"/>
                    <path d="M0 0 L10.9 7.08"  stroke="#EEF3F9" stroke-width="6.5"/>
                    <path d="M0 0 L10.9 -7.08" stroke="#EEF3F9" stroke-width="6.5"/>
                  </g>
                  <circle r="6" fill="#5A7288" stroke="#1B2838" stroke-width="3"/>
                </g>
              </g>
              <circle r="6" fill="#5A7288" stroke="#1B2838" stroke-width="3"/>
            </g>
            <circle r="7" fill="#5A7288" stroke="#1B2838" stroke-width="3.2"/>
          </g>
        </g>

        <g id="arm-r" transform="translate(182,144) scale(-1,1)">
          <g class="j-sh" transform="rotate(-98.9)">
            <animateTransform attributeName="transform" type="rotate"
               values="-98.9;-98.9;-69.5;-69.5;-110.5;-111.9;-69.5;-101.7;-98.9"
               keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1"
               begin="merge.begin" dur="2.2s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
            <path d="M0 0 L32.5 0" stroke="#1B2838" stroke-width="16"/>
            <path d="M0 0 L32.5 0" stroke="#EEF3F9" stroke-width="9.5"/>
            <g transform="translate(32.5,0)">
              <g class="j-el" transform="rotate(66.4)">
                <animateTransform attributeName="transform" type="rotate"
                   values="66.4;66.4;41.7;41.7;62.5;38.1;41.7;62.9;66.4"
                   keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1"
                   begin="merge.begin" dur="2.2s" fill="freeze"
                   calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
                <path d="M0 0 L29 0" stroke="#1B2838" stroke-width="15"/>
                <path d="M0 0 L29 0" stroke="#EEF3F9" stroke-width="9"/>
                <g transform="translate(29,0)">
                  <g class="j-wr" transform="rotate(37.5)">
                    <animateTransform attributeName="transform" type="rotate"
                       values="37.5;37.5;30.0;30.0;40.0;55.0;25.0;40.0;37.5"
                       keyTimes="0;0.06;0.3;0.42;0.56;0.68;0.79;0.88;1"
                       begin="merge.begin" dur="2.2s" fill="freeze"
                       calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;.3 0 .7 1;.8 0 1 1;.1 0 .3 1;.4 0 .2 1"/>
                    <path d="M0 0 L10.9 7.08"  stroke="#1B2838" stroke-width="12"/>
                    <path d="M0 0 L10.9 -7.08" stroke="#1B2838" stroke-width="12"/>
                    <path d="M0 0 L10.9 7.08"  stroke="#EEF3F9" stroke-width="6.5"/>
                    <path d="M0 0 L10.9 -7.08" stroke="#EEF3F9" stroke-width="6.5"/>
                  </g>
                  <circle r="6" fill="#5A7288" stroke="#1B2838" stroke-width="3"/>
                </g>
              </g>
              <circle r="6" fill="#5A7288" stroke="#1B2838" stroke-width="3"/>
            </g>
            <circle r="7" fill="#5A7288" stroke="#1B2838" stroke-width="3.2"/>
          </g>
        </g>
      </g>


    </g>
  </g>
</svg>
